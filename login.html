<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | CloudBox</title><link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-icon">☁</span> CloudBox</a>
  <main class="auth-card">
    <a class="back-link" href="index.html">← Back to home</a>
    <div class="auth-heading"><div class="large-icon">☁</div><h1>Welcome back</h1><p>Log in to access your cloud files.</p></div>
    <form id="login-form">
      <label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
      <label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
      <button class="button full-button" type="submit">Log in</button>
      <p id="auth-message" class="message" role="status"></p>
    </form>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
  </main>
  <script type="module">
    import { login } from "./js/auth.js";
    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.querySelector("#auth-message");
      message.textContent = "Logging in...";
      try {
        await login(document.querySelector("#email").value.trim(), document.querySelector("#password").value);
        window.location.href = "dashboard.html";
      } catch (error) { message.textContent = error.message; }
    });
  </script>
</body>
</html>
